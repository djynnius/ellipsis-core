[project]
name = "ellipsis-app"
version = "0.1.0"
description = "An app built on the ellipsis Flask scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "flask-session>=0.8",
    # Socket.IO is baked in but off. Uncomment here, in app.py and in views/base.html.
    # "flask-socketio>=5.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
pythonpath = ["."]
