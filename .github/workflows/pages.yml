# Publishes ellipsis-core-site/ to https://djynnius.github.io/ellipsis-core/
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "ellipsis-core-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ellipsis-core-site
      - id: deployment
        uses: actions/deploy-pages@v5
